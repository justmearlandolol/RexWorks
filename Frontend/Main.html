<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>RexWork — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0c11;
  --bg-2:#0e1118;
  --surface:#12161f;
  --surface-2:#1a2029;
  --border:#263041;
  --border-soft:#1d2530;
  --text:#e9edf5;
  --muted:#8791a5;
  --faint:#5a6478;
  --brand:#ffb000;
  --red:#ff6b6b;
  --font-pixel:'Press Start 2P','VT323','Courier New',monospace;
  --font-mono:'IBM Plex Mono','VT323',ui-monospace,monospace;
  --font-body:'VT323','Courier New',monospace;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  display:grid;
  place-items:center;
  min-height:100dvh;
  padding:24px;
  overflow:hidden;
  /* dotted pixel grid */
  background-image:radial-gradient(rgba(255,176,0,.05) 1px, transparent 1.6px);
  background-size:26px 26px;
}
/* scanlines */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:2;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);
}
/* soft vignette */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0,0,0,.55) 100%);
}

.card{
  position:relative; z-index:3;
  width:min(400px, 100%);
  background:linear-gradient(180deg, var(--surface), var(--bg-2));
  border:1px solid var(--border);
  border-radius:6px;
  padding:44px 36px 32px;
  text-align:center;
  box-shadow:0 0 0 1px rgba(255,176,0,.06), 0 24px 70px rgba(0,0,0,.6), 0 0 90px rgba(255,176,0,.05);
}
/* pixel corner accents */
.card i.px{ position:absolute; width:7px; height:7px; background:var(--brand); image-rendering:pixelated; }
.card i.px.tl{ top:-1px; left:-1px; }
.card i.px.tr{ top:-1px; right:-1px; }
.card i.px.bl{ bottom:-1px; left:-1px; }
.card i.px.br{ bottom:-1px; right:-1px; }

.logo{
  width:52px; height:52px; margin:0 auto 18px;
  background:var(--brand); color:#1a1405;
  font-family:var(--font-pixel); font-size:22px;
  display:grid; place-items:center;
  border-radius:4px;
  box-shadow:4px 4px 0 rgba(0,0,0,.45), 0 0 34px rgba(255,176,0,.35);
}
h1{
  font-family:var(--font-pixel); font-size:20px; letter-spacing:2px;
  color:var(--text); margin-bottom:14px;
}
h1 .cur{ color:var(--brand); animation:blink 1.1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.tag{
  font-family:var(--font-pixel); font-size:7.5px; letter-spacing:2px; line-height:2.1;
  color:var(--muted); margin-bottom:34px;
}

.divider{
  border-top:1px dashed var(--border); margin:0 0 28px;
  position:relative;
}
.divider span{
  position:absolute; top:-7px; left:50%; transform:translateX(-50%);
  background:var(--bg-2); padding:0 10px;
  font-family:var(--font-pixel); font-size:6.5px; letter-spacing:2px; color:var(--faint);
}

.gbtn{
  width:100%; height:48px;
  display:flex; align-items:center; justify-content:center; gap:12px;
  background:#ffffff; border:1px solid #dadce0; border-radius:4px;
  cursor:pointer; user-select:none;
  color:#3c4043;
  font-family:Arial, 'Helvetica Neue', sans-serif; font-size:15.5px; font-weight:500; letter-spacing:.2px;
  transition:box-shadow .15s ease, transform .05s ease, background .15s ease;
}
.gbtn:hover{ background:#f8f9fa; box-shadow:0 2px 10px rgba(0,0,0,.35), 0 0 0 1px rgba(255,176,0,.25); }
.gbtn:active{ transform:translateY(1px) scale(.995); }
.gbtn:disabled{ opacity:.55; cursor:default; transform:none; }
.gbtn svg{ flex:0 0 auto; }

.status{
  min-height:20px; margin-top:20px;
  font-family:var(--font-pixel); font-size:7.5px; letter-spacing:1.5px; line-height:1.9;
  color:var(--brand);
  overflow-wrap:anywhere;
}
.foot{
  margin-top:6px;
  font-family:var(--font-pixel); font-size:6px; letter-spacing:2px; color:var(--faint);
}
.note{
  margin-top:14px; font-size:15px; line-height:1.35; color:var(--faint);
  display:none;
}
.note.show{ display:block; }
.note code{ color:var(--brand); font-family:var(--font-mono); font-size:13px; }
</style>
</head>
<body>

<div class="card">
  <i class="px tl"></i><i class="px tr"></i><i class="px bl"></i><i class="px br"></i>

  <div class="logo">R</div>
  <h1>REXWORK<span class="cur">█</span></h1>
  <div class="tag">ONE WORKSPACE.<br/>EVERY WAY TO THINK.</div>

  <div class="divider"><span>SIGN IN</span></div>

  <button class="gbtn" id="gbtn" aria-label="Login with Google">
    <svg width="19" height="19" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span>Login with Google</span>
  </button>

  <div class="status" id="status">READY — PRESS LOGIN TO CONTINUE</div>

  <div class="note" id="note">
    Demo login aktif. Untuk Google sign-in beneran, isi
    <code>GOOGLE_CLIENT_ID</code> di file ini dengan OAuth Client ID dari
    Google Cloud Console.
  </div>

  <div class="foot">SECURED BY GOOGLE · REXWORK v1.1</div>
</div>

<script>
'use strict';

/* ============================================================
   CONFIG — isi dengan OAuth Client ID (type: Web application)
   dari https://console.cloud.google.com/apis/credentials
   Authorized JavaScript origins: http://127.0.0.1:8000
   Kalau kosong -> tombol jalan sebagai DEMO login.
   ============================================================ */
const GOOGLE_CLIENT_ID = '';

const AUTH_KEY = 'rexwork_auth';
const btn    = document.getElementById('gbtn');
const statusEl = document.getElementById('status');
const noteEl = document.getElementById('note');

if(!GOOGLE_CLIENT_ID) noteEl.classList.add('show');

function setStatus(text, color){
  statusEl.textContent = text;
  statusEl.style.color = color || 'var(--brand)';
}

function saveAuth(profile){
  localStorage.setItem(AUTH_KEY, JSON.stringify(Object.assign({ ts: Date.now() }, profile)));
  location.replace('index.html');
}

/* Kalau sudah login, langsung masuk app */
try{
  const a = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
  if(a && a.provider){
    setStatus('SESSION FOUND — OPENING REXWORK…');
    setTimeout(()=>location.replace('index.html'), 350);
  }
}catch(e){}

/* ---------- REAL GOOGLE SIGN-IN (kalau CLIENT_ID diisi) ---------- */
let tokenClient = null;

function initGoogle(){
  if(!GOOGLE_CLIENT_ID) return;
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true; s.defer = true;
  s.onload = ()=>{
    try{
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'openid profile email',
        callback: async (resp)=>{
          if(!resp || !resp.access_token){
            setStatus('SIGN-IN CANCELLED', 'var(--red)');
            btn.disabled = false;
            return;
          }
          setStatus('VERIFYING ACCOUNT…');
          try{
            const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
              headers: { Authorization: 'Bearer ' + resp.access_token }
            });
            const u = await r.json();
            setStatus('SIGNED IN — OPENING REXWORK…');
            setTimeout(()=>saveAuth({
              provider: 'google', demo: false,
              name: u.name || u.email || 'User',
              email: u.email || '', picture: u.picture || ''
            }), 400);
          }catch(err){
            setStatus('FAILED TO FETCH PROFILE — TRY AGAIN', 'var(--red)');
            btn.disabled = false;
          }
        }
      });
    }catch(e){ /* tetap bisa demo login */ }
  };
  document.head.appendChild(s);
}
initGoogle();

/* ---------- CLICK ---------- */
btn.addEventListener('click', ()=>{
  btn.disabled = true;

  if(tokenClient){
    setStatus('OPENING GOOGLE SIGN-IN…');
    tokenClient.requestAccessToken({ prompt: 'select_account' });
    return;
  }

  /* Demo login (offline / belum ada client id) */
  setStatus('CONNECTING TO GOOGLE…');
  setTimeout(()=>setStatus('SIGNED IN — OPENING REXWORK…'), 650);
  setTimeout(()=>saveAuth({
    provider: 'google', demo: true,
    name: 'ARLANDO', email: ''
  }), 1150);
});
</script>
</body>
</html>
