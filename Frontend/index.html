<style>

:root{
  --bg:#0a0c11;
  --bg-2:#0e1118;
  --surface:#12161f;
  --surface-2:#1a2029;

  --faint:#5a6478;
  --brand:#ffb000;
  --brand-dim:#8a6a1a;
  --green:#66d48a;
  --red:#ff6b6b;
  --cyan:#4dd0e1;
  --purple:#ab8bf0;
  --pink:#f06292;

}
html[data-density="compact"]{ --fs-body:16px; }
html[data-density="spacious"]{ --fs-body:20px; }
html[data-font="sm"]{ --fs-body:16px; }

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:var(--fs-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.pixel{ font-family:var(--font-pixel); text-transform:uppercase; letter-spacing:.5px; }
button{ font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input,textarea,select{ font-family:inherit; color:inherit; }
a{ color:var(--cyan); }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:8px; }
::-webkit-scrollbar-thumb:hover{ background:#2f3950; }
::-webkit-scrollbar-track{ background:transparent; }
.hidden{ display:none !important; }
.muted{ color:var(--muted); }
.faint{ color:var(--faint); }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }


#app{ display:flex; height:100vh; height:100dvh; }
#main{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }


#sidebar{
  width:var(--sidebar-w);
  background:var(--bg-2);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  transition:margin-left .25s cubic-bezier(0.4, 0, 0.2, 1);
  z-index:40;

}

}

  max-width:1120px;
}
#tb-toggle-sidebar{

}
.side-item:hover .side-del-btn{ display:inline-flex; }
.side-item .side-del-btn:hover{ color:var(--red); background:rgba(255,107,107,.15); }
.agent-model-picker{ position:relative; display:inline-flex; align-items:center; }
.agent-model-btn{

#sidebar .side-scroll{ flex:1; overflow-y:auto; padding:10px 10px 24px; }

.side-item{

#view{ flex:1; overflow-y:auto; position:relative; scroll-behavior:smooth; }

.welcome{ max-width:820px; margin:0 auto; padding:70px 24px 40px; text-align:center; }
.welcome .mark{ font-family:var(--font-pixel); font-size:26px; letter-spacing:2px; margin-bottom:8px; }

.suggest{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:30px; }

}

.msg{ padding:10px 0; display:flex; gap:12px; }
.msg .role-ico{ width:26px; height:26px; border-radius:3px; flex:0 0 auto; display:grid; place-items:center; font-family:var(--font-pixel); font-size:10px; margin-top:3px; }
.msg.user .role-ico{ background:var(--surface-3); color:var(--brand); }

.msg .body{ flex:1; min-width:0; }
.msg .who{ font-family:var(--font-pixel); font-size:8px; letter-spacing:1px; margin-bottom:5px; color:var(--muted); }

}

.md{ word-break:break-word; }
.md p{ margin:0 0 10px; }

.md ul,.md ol{ margin:0 0 10px; padding-left:22px; }
.md li{ margin:3px 0; }
.md blockquote{ border-left:3px solid var(--brand); padding:4px 14px; margin:10px 0; color:var(--text-soft); background:var(--surface); border-radius:0 var(--radius) var(--radius) 0; }
.md code.inline{ background:var(--surface-2); border:1px solid var(--border); padding:1px 6px; border-radius:3px; font-family:var(--font-mono); font-size:.85em; color:var(--cyan); }
.md pre{ position:relative; background:#0b0e14; border:1px solid var(--border); border-radius:var(--radius); margin:12px 0; overflow:hidden; }
.md pre .pre-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:var(--surface); border-bottom:1px solid var(--border); }

}

.sources{ margin:10px 0; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }

#composer{ padding:10px 16px 14px; }

.card .card-head{ display:flex; align-items:center; gap:9px; padding:13px 16px; border-bottom:1px solid var(--border-soft); }
.card .card-head .lbl{ font-family:var(--font-pixel); font-size:9px; letter-spacing:1px; flex:1; }
.card .card-body{ padding:16px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-family:var(--font-pixel); font-size:8px; letter-spacing:1px; color:var(--muted); margin-bottom:7px; }
.input, .select, textarea.input{
  width:100%; background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 12px; font-size:16px; color:var(--text); outline:none;
}
.input:focus,.select:focus,textarea.input:focus{ border-color:var(--muted); }
textarea.input{ resize:vertical; min-height:90px; }
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:10px 16px; border-radius:var(--radius);
  font-family:var(--font-pixel); font-size:8px; letter-spacing:1px; border:1px solid var(--border); color:var(--text-soft);
}
.btn:hover{ border-color:var(--muted); }
.btn.primary{ background:var(--brand); color:#1a1405; border-color:var(--brand); }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--red); border-color:var(--red); }
.btn.danger:hover{ background:var(--red); color:#fff; }
.row{ display:flex; align-items:center; gap:10px; }
.spacer{ flex:1; }
.opt-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid var(--border-soft); }
.opt-row:last-child{ border-bottom:none; }
.opt-row .ol{ font-size:15px; } .opt-row .os{ color:var(--muted); font-size:13px; }
.seg{ display:flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.seg button{ padding:8px 14px; font-family:var(--font-pixel); font-size:8px; letter-spacing:1px; color:var(--muted); }
.seg button.on{ background:var(--surface-3); color:var(--text); }
.seg button + button{ border-left:1px solid var(--border); }

.switch{ position:relative; width:42px; height:24px; flex:0 0 auto; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{ position:absolute; inset:0; background:var(--surface-3); border-radius:14px; transition:.2s; cursor:pointer; }
.switch .track::after{ content:''; position:absolute; width:18px; height:18px; background:var(--muted); border-radius:50%; top:3px; left:3px; transition:.2s; }
.switch input:checked + .track{ background:var(--brand); }
.switch input:checked + .track::after{ transform:translateX(18px); background:#1a1405; }


.mem-item{ display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border-soft); }
.mem-item:last-child{ border-bottom:none; }
.mem-item .txt{ flex:1; font-size:15px; }
.mem-item .acts{ display:none; gap:2px; }
.mem-item:hover .acts{ display:flex; }


.proj-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.proj-card{ border:1px solid var(--border); border-radius:8px; padding:15px; background:var(--surface); cursor:pointer; }
.proj-card:hover{ border-color:var(--muted); }
.proj-card .pc-top{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
.proj-card .pc-name{ font-family:var(--font-pixel); font-size:9px; letter-spacing:1px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.proj-card .pc-meta{ font-size:13px; color:var(--muted); }
.proj-card .swatch{ width:10px; height:10px; border-radius:2px; }


#canvas-col{ border-left:1px solid var(--border-soft); display:flex; flex-direction:column; min-width:0; background:var(--bg-2); }
.canvas-head{ display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap; }
.canvas-head .ct{ font-family:var(--font-pixel); font-size:9px; letter-spacing:1px; margin-right:6px; }
.canvas-body{ flex:1; display:flex; overflow:hidden; }
.canvas-edit{ flex:1; display:flex; flex-direction:column; }
#canvas-input{ flex:1; background:transparent; border:none; outline:none; resize:none; padding:16px; font-family:var(--font-mono); font-size:14px; line-height:1.6; color:var(--text); }
.canvas-code-wrap{ flex:1; display:flex; overflow:hidden; position:relative; }
.canvas-gutter{ padding:16px 8px; text-align:right; color:var(--faint); font-family:var(--font-mono); font-size:14px; line-height:1.6; user-select:none; background:var(--bg-2); border-right:1px solid var(--border-soft); overflow:hidden; }
#canvas-input.code{ line-height:1.6; }
.canvas-preview{ flex:1; overflow-y:auto; padding:18px; }
.canvas-empty{ margin:auto; text-align:center; color:var(--faint); font-size:14px; }


.popover{
  position:absolute; z-index:60; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; box-shadow:var(--shadow); min-width:230px; overflow:hidden;
  display:none; animation:pop .12s ease;
}
.popover.open{ display:block; }
@keyframes pop{ from{ opacity:0; transform:translateY(-4px);} to{ opacity:1; transform:none;} }
.pop-item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:11px 14px; }
.pop-item:hover{ background:var(--surface-2); }
.pop-item .mi-ico{ width:24px; height:24px; border-radius:3px; display:grid; place-items:center; font-family:var(--font-pixel); font-size:9px; flex:0 0 auto; }
.pop-item .mi-txt{ flex:1; min-width:0; }
.pop-item .mi-name{ font-family:var(--font-pixel); font-size:9px; letter-spacing:.5px; }
.pop-item .mi-desc{ font-size:13px; color:var(--muted); margin-top:2px; line-height:1.2; }
.pop-item .mi-model{ font-size:11px; color:var(--faint); margin-top:2px; }
.pop-item .mi-avail{ font-family:var(--font-pixel); font-size:7px; letter-spacing:.5px; padding:2px 5px; border-radius:2px; flex:0 0 auto; }
.mi-avail.ok{ color:var(--green); border:1px solid rgba(102,212,138,.4); }
.mi-avail.off{ color:var(--faint); border:1px solid var(--border); }
.mi-avail.demo{ color:var(--brand); border:1px solid var(--brand-dim); }
.pop-item.sel{ background:var(--surface-2); box-shadow:inset 2px 0 0 var(--brand); }
.pop-label{ font-family:var(--font-pixel); font-size:7px; letter-spacing:1px; color:var(--faint); padding:10px 14px 4px; }


.overlay{ position:fixed; inset:0; background:rgba(4,6,10,.7); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; animation:fade .15s ease; }
@keyframes fade{ from{opacity:0;} to{opacity:1;} }
.modal{ background:var(--surface); border:1px solid var(--border); border-radius:10px; width:100%; max-width:440px; box-shadow:var(--shadow); }
.modal.wide{ max-width:600px; }
.modal-head{ display:flex; align-items:center; gap:9px; padding:15px 18px; border-bottom:1px solid var(--border-soft); }
.modal-head .mh{ font-family:var(--font-pixel); font-size:10px; letter-spacing:1px; flex:1; }
.modal-body{ padding:18px; }
.modal-foot{ display:flex; gap:9px; justify-content:flex-end; padding:0 18px 18px; }
.modal-foot .btn{ min-width:90px; justify-content:center; }


#toasts{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-soft); font-family:var(--font-pixel); font-size:8px; letter-spacing:1px; padding:10px 18px; border-radius:6px; box-shadow:var(--shadow); animation:toastin .2s ease; }
@keyframes toastin{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }


#search-overlay{ position:fixed; inset:0; z-index:90; background:rgba(4,6,10,.72); display:none; align-items:flex-start; justify-content:center; padding:9vh 16px 24px; }
#search-overlay.open{ display:flex; }
.search-modal{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; }
.search-modal input{ width:100%; background:transparent; border:none; outline:none; padding:17px 18px; font-size:17px; color:var(--text); }
.search-modal input::placeholder{ color:var(--faint); }
.search-res{ max-height:50vh; overflow-y:auto; border-top:1px solid var(--border-soft); }
.search-res .sr-label{ font-family:var(--font-pixel); font-size:7px; letter-spacing:1px; color:var(--faint); padding:12px 18px 4px; }
.search-res .sr-item{ display:block; width:100%; text-align:left; padding:10px 18px; font-size:15px; }
.search-res .sr-item:hover{ background:var(--surface-2); }
.search-res .sr-item mark{ background:rgba(255,176,0,.3); color:var(--text); border-radius:2px; }
.search-empty{ padding:26px 18px; text-align:center; color:var(--faint); font-size:14px; }


@media (max-width:880px){
  :root{ --sidebar-w:260px; }
  #sidebar{ position:fixed; left:0; top:0; bottom:0; transform:translateX(-105%); }
  #sidebar.open{ transform:translateX(0); box-shadow:var(--shadow); }
  #tb-menu{ display:grid; }
  #scrim{ position:fixed; inset:0; background:rgba(4,6,10,.6); z-index:35; display:none; }
  #scrim.show{ display:block; }
  #view.has-canvas{ display:flex; flex-direction:column; }
  #canvas-col{ border-left:none; border-top:1px solid var(--border-soft); height:50%; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
}

.coding-workspace-box{
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--surface);
  margin-bottom:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.ws-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; background:var(--surface-2);
  border-bottom:1px solid var(--border); flex-wrap:wrap; gap:8px;
}
.ws-title{ display:flex; align-items:center; gap:10px; }
.ws-badge{ font-family:var(--font-mono); font-size:11px; color:var(--muted); background:var(--surface-3); padding:2px 8px; border-radius:3px; }
.ws-acts{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ws-btn{ padding:5px 10px; font-size:11px; font-family:var(--font-mono); }
.ws-tabs{
  display:flex; overflow-x:auto; background:var(--bg-2);
  border-bottom:1px solid var(--border); scrollbar-width:thin;
}
.ws-tab{
  display:flex; align-items:center; gap:8px; padding:8px 14px;
  font-family:var(--font-mono); font-size:12px; color:var(--muted);
  border-right:1px solid var(--border); cursor:pointer; user-select:none;
}
.ws-tab.active{
  background:var(--surface); color:var(--brand); font-weight:600;
  border-bottom:2px solid var(--brand);
}
.ws-tab:hover{ color:var(--text); }
.ws-tab-del{ font-size:14px; opacity:.6; cursor:pointer; margin-left:4px; }
.ws-tab-del:hover{ opacity:1; color:var(--red); }
.ws-editor-wrap{ display:flex; flex-direction:column; background:var(--surface); }
.ws-editor-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px; background:var(--surface-2); font-size:11px; color:var(--faint);
  border-bottom:1px solid var(--border-soft);
}
.ws-code-textarea{
  width:100%; height:180px; min-height:120px; max-height:450px; background:var(--bg); color:#c9d1d9;
  font-family:var(--font-mono); font-size:12.5px; line-height:1.5; padding:12px;
  border:none; outline:none; resize:vertical;
}
.ws-terminal{
  border-top:1px solid var(--border); background:#05070a; font-family:var(--font-mono); font-size:11.5px;
}
.term-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 12px; background:#0b0e14; color:var(--brand); font-size:9.5px; font-family:var(--font-pixel);
}
.term-body{
  max-height:130px; overflow-y:auto; padding:8px 12px; color:#51cf66;
}
.term-line{ margin-bottom:2px; word-break:break-all; }
.term-input-row{
  display:flex; align-items:center; gap:8px; padding:6px 12px; background:#070a0f; border-top:1px solid #141b26;
}
.term-prompt{ color:var(--brand); font-weight:bold; }
.term-input{
  flex:1; background:transparent; border:none; outline:none; color:#f0f3f8; font-family:var(--font-mono); font-size:12px;
}
.ws-add-code-btn{
  margin-top:6px; font-size:10.5px; font-family:var(--font-mono); padding:3px 8px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:4px;
  color:var(--brand); cursor:pointer; display:inline-flex; align-items:center; gap:4px;
}
.ws-add-code-btn:hover{ background:var(--surface-3); border-color:var(--brand); }
.comp-tool-chip{
  font-family:var(--font-mono); font-size:11px; padding:3px 8px; border-radius:4px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--muted);
  cursor:pointer; display:inline-flex; align-items:center; gap:4px; transition:all .15s;
}
.comp-tool-chip.active{
  border-color:var(--brand); background:rgba(255,176,0,.15); color:var(--brand); font-weight:600;
}

#composer{ position:relative; }
.composer-tools{ position:relative; }
#search-overlay,.overlay{ z-index:300; }
#toasts{ z-index:320; }
.agent-model-picker{ z-index:170; }
.agent-model-menu{ z-index:180; }
.agent-icon,.amm-icon,.tool-menu-icon{
  display:grid; place-items:center; flex:0 0 auto;
}
.agent-icon{ width:16px; height:16px; color:var(--cyan); }
.agent-icon svg{ width:16px; height:16px; }
.amm-icon{ width:28px; height:28px; border:1px solid var(--border); border-radius:5px; background:var(--surface); }
.amm-icon svg{ width:16px; height:16px; }
.amm-icon.chat{ color:var(--cyan); }
.amm-icon.code{ color:var(--brand); }
.amm-icon.vision{ color:var(--green); }
.composer-add-btn{
  width:30px; height:30px; border:1px solid var(--border); border-radius:50%; color:var(--text-soft);
  background:var(--surface-2); transition:background .15s,border-color .15s,color .15s,transform .15s;
}
.composer-add-btn:hover,.composer-add-btn[aria-expanded="true"]{
  background:var(--surface-3); border-color:var(--brand); color:var(--brand); transform:rotate(90deg);
}
.composer-add-btn svg{ width:17px; height:17px; }
#tools-pop.composer-tools-pop{
  position:fixed; z-index:190; min-width:250px; max-width:min(320px,calc(100vw - 16px)); padding:6px;
}
.composer-tool-item{ border-radius:6px; }
.composer-tool-item .mi-name{ display:flex; align-items:center; gap:7px; }
.tool-menu-icon{ width:28px; height:28px; color:var(--muted); border:1px solid var(--border); border-radius:5px; background:var(--surface); }
.tool-menu-icon svg{ width:16px; height:16px; }
.composer-tool-item:hover .tool-menu-icon{ color:var(--brand); border-color:var(--brand-dim); }
.tool-status{ margin-left:auto; font-family:var(--font-pixel); font-size:7px; letter-spacing:.5px; color:var(--faint); }
.tool-status.on{ color:var(--green); }
@media (max-width:560px){
  #composer{ padding:8px 8px 10px; }
  .agent-model-menu{ width:min(280px,calc(100vw - 24px)); }
}


.cot-wrap{
  margin-bottom:12px; border:1px solid var(--border); border-radius:6px;
  background:var(--surface-2); overflow:hidden;
}
.cot-toggle{
  width:100%; display:flex; align-items:center; gap:8px; padding:7px 12px;
  background:none; border:none; color:var(--muted); font-family:var(--font-mono);
  font-size:11.5px; cursor:pointer; text-align:left; user-select:none;
}
.cot-toggle:hover{ color:var(--text); background:rgba(255,255,255,.02); }
.cot-icon{ font-size:12px; }
.cot-label{ flex:1; font-weight:500; letter-spacing:.3px; }
.cot-arrow{ transition:transform .2s; }
.cot-wrap.open .cot-arrow{ transform:rotate(180deg); }
.cot-body{
  display:none; padding:10px 14px; border-top:1px solid var(--border-soft);
  font-size:12px; line-height:1.5; color:var(--muted); font-family:var(--font-mono);
  background:rgba(0,0,0,.2); max-height:280px; overflow-y:auto;
}
.cot-wrap.open .cot-body{ display:block; }
.agent-pills-row{
  display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;
}
.agent-pill{
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px;
  border-radius:12px; font-family:var(--font-mono); font-size:11px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  line-height:1.4; user-select:none;
}
.agent-pill.bash{ border-color:rgba(102,212,138,.3); background:rgba(102,212,138,.08); color:#66d48a; }
.agent-pill.explored{ border-color:rgba(77,208,225,.3); background:rgba(77,208,225,.08); color:#4dd0e1; }
.agent-pill.read{ border-color:rgba(171,139,240,.3); background:rgba(171,139,240,.08); color:#ab8bf0; }
.agent-pill.created{ border-color:rgba(255,176,0,.3); background:rgba(255,176,0,.08); color:var(--brand); }
.agent-pill .ap-ico{ font-size:11px; }
.stream-cancel-row{ margin-top:8px; display:flex; align-items:center; }
.btn-stream-cancel{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.35); border-radius:14px; color:#ff6b6b; font-family:var(--font-mono); font-size:11px; cursor:pointer; transition:all .15s ease; }
.btn-stream-cancel:hover{ background:rgba(255,107,107,.25); border-color:#ff6b6b; color:#fff; }
.btn-cancel-active{ border-color:var(--red) !important; color:var(--red) !important; background:rgba(255,107,107,.15) !important; }
.thinking-indicator{
  display:inline-flex; align-items:center; gap:8px; padding:6px 12px;
  background:rgba(255,176,0,.08); border:1px solid rgba(255,176,0,.25);
  border-radius:16px; font-family:var(--font-mono); font-size:11px;
  color:var(--brand); margin-bottom:10px; animation:pulse-glow 1.5s infinite;
}
@keyframes pulse-glow{
  0%,100%{ opacity:.75; } 50%{ opacity:1; }
}


#main{ min-height:0; }
#view{
  display:grid;
  min-height:0;
  grid-template-columns:minmax(0,1fr) 282px;
  overflow:hidden;
}
#chat-col,
#chat-col .msg-scroll{
  min-height:0;
}
#view.has-canvas{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(300px,.82fr) 282px;
}
#view.workspace-hidden{
  grid-template-columns:minmax(0,1fr);
}
#view.workspace-hidden.has-canvas{
  grid-template-columns:minmax(0,1fr) minmax(300px,.82fr);
}
#workspace-panel{
  min-width:0;
  border-left:1px solid var(--border-soft);
  background:var(--bg-2);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.workspace-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 14px 11px;
  border-bottom:1px solid var(--border-soft);
}
.workspace-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--font-mono);
  font-size:14px;
  font-weight:500;
  color:var(--text-soft);
}
.workspace-title svg{ width:16px; height:16px; color:var(--muted); }
.workspace-download-all{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  color:var(--muted);
  border-radius:4px;
}
.workspace-download-all:hover:not(:disabled){ color:var(--text); background:var(--surface-2); }
.workspace-download-all:disabled{ cursor:not-allowed; opacity:.38; }
.workspace-download-all svg{ width:16px; height:16px; }
.workspace-meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:9px 14px;
  border-bottom:1px solid var(--border-soft);
  color:var(--faint);
  font-family:var(--font-mono);
  font-size:11px;
}
.workspace-meter{ height:2px; background:var(--surface-3); overflow:hidden; }
.workspace-meter > span{ display:block; height:100%; background:var(--brand); min-width:1px; }
.workspace-list{ flex:1; overflow-y:auto; padding:8px; }
.workspace-section-label{
  padding:7px 7px 5px;
  color:var(--faint);
  font-family:var(--font-pixel);
  font-size:7px;
  letter-spacing:.9px;
}
.workspace-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  padding:8px 7px;
  border-radius:5px;
  color:var(--text-soft);
  font-family:var(--font-mono);
  font-size:12px;
}
.workspace-row:hover{ background:var(--surface); }
.workspace-row .workspace-row-icon{ width:16px; height:16px; flex:0 0 auto; color:var(--muted); }
.workspace-row.file .workspace-row-icon{ color:var(--cyan); }
.workspace-row .workspace-row-icon svg{ width:16px; height:16px; }
.workspace-row-name{ min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.workspace-file-download{
  width:25px;
  height:25px;
  display:grid;
  place-items:center;
  opacity:0;
  pointer-events:none;
  color:var(--muted);
  border-radius:4px;
  transition:opacity .15s,color .15s,background .15s;
}
.workspace-row:hover .workspace-file-download,.workspace-file-download:focus-visible{
  opacity:1;
  pointer-events:auto;
}

function lsGet(k, fallback){
  try{ const v = localStorage.getItem(k); return v==null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
}
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getUserDisplayName(){
  const pick = (profile)=>{
    if(!profile) return '';

    const values = [profile.name, profile.displayName, profile.display_name, profile.username, metadata.full_name, metadata.name, metadata.user_name, metadata.preferred_username];
    for(const value of values){
      if(typeof value === 'string' && value.trim()) return value.trim();
    }
    if(typeof profile.email === 'string' && profile.email.trim()) return profile.email.split('@')[0].trim();
    return '';
  };
  return pick(state.auth) || pick(authProfile()) || 'User';
}

function timeGroup(ts){
  const d=new Date(ts), n=new Date();
  const s=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  const day=86400000;
  const diff=s - new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  if(diff<=0) return 'TODAY';
  if(diff<=day) return 'YESTERDAY';
  if(diff<=7*day) return 'PREVIOUS 7 DAYS';
  return 'OLDER';
}
function timeLabel(ts){
  const d=new Date(ts), n=new Date();
  const diff=n.getTime()-ts;
  if(diff<60000) return 'Just now';
  if(diff<3600000) return Math.floor(diff/60000)+' min ago';
  if(diff<7200000) return '1 hour ago';
  if(diff<86400000) return Math.floor(diff/3600000)+' hours ago';
  const s=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  if(s-dd===86400000) return 'Yesterday';
  if(diff<7*86400000) return d.toLocaleDateString('en-US',{weekday:'long'});
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

const META_API_BASE = ((document.querySelector('meta[name="rexwork-api"]') || {}).content || '').trim().replace(/\/+$/, '');
let API_BASE = META_API_BASE || '';

async function probeHealth(base){
  const url = (base ? base.replace(/\/+$/, '') : '') + '/api/health';
  const r = await fetch(url, { signal: AbortSignal.timeout(4500) });
  if(!r.ok) throw new Error('health:' + r.status);
  return await r.json();
}

async function checkBackend(){
  
  const candidates = [
    META_API_BASE,
    '',
    'http://127.0.0.1:8000'
  ].filter((v, idx, arr) => arr.indexOf(v) === idx);

  for (const cand of candidates) {
    try {
      const j = await probeHealth(cand);
      API_BASE = cand; 
      state.backend = {
        reachable: true,
        keysLoaded: j.keys_loaded || 0,
        visionAvailable: !!j.vision_available,
        checked: true
      };
      return;
    } catch (e) {
      
    }
  }

  state.backend = { reachable:false, keysLoaded:0, visionAvailable:false, checked:true };
}

function isDemo(){
  return !state.backend.reachable || state.backend.keysLoaded===0;
}

async function streamChat(mode, messages, onDelta, signal){
  
  if(isDemo()){
    return await demoStream(mode, messages, onDelta);
  }
  if(mode==='vision' && !state.backend.visionAvailable){
    return { ok:false, error:'VISION_MODEL_UNAVAILABLE', message:'REXWORK VISION is not available. No Groq vision-capable model is configured.' };
  }
  try{
    const body = { mode, messages, tools:{ web_search:state.search.webSearch, deep_research:state.search.deepResearch } };
    const res = await fetch(API_BASE + '/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body), signal });
    if(!res.ok){
      let j=null; try{ j=await res.json(); }catch(e){}
      return { ok:false, error: j && j.error, message: j && j.message };
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf='';
    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      buf += dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const line = buf.slice(0,idx); buf=buf.slice(idx+2);
        for(const ln of line.split('\n')){
          if(!ln.startsWith('data:')) continue;
          const data = ln.slice(5).trim();
          if(data==='[DONE]') continue;
          try{
            const j = JSON.parse(data);
            if(j.error){
              if(j.error==='NO_KEYS'){ state.backend.keysLoaded=0; }
              return { ok:false, error:j.error, message:j.message };
            }
            if(j.delta) onDelta(j.delta);
          }catch(e){}
        }
      }
    }
    return { ok:true };
  }catch(e){
    if(e.name==='AbortError') return { ok:false, error:'ABORTED' };
    return { ok:false, error:'NETWORK' };
  }
}


async function demoStream(mode, messages, onDelta){
  const lastUser = [...messages].reverse().find(m=>m.role==='user');
  const text = (lastUser && lastUser.content) || '';
  const answer = demoAnswer(mode, text);
  const words = answer.split(/(\s+)/);
  const chunk = 3;
  for(let i=0;i<words.length;i+=chunk){
    await sleep(14);
    onDelta(words.slice(i,i+chunk).join(''));
  }
  return { ok:true, demo:true };
}

function demoAnswer(mode, text){
  const t = text.replace(/[\[\]]/g,'').trim();
  const hint = '> ⚠️ **DEMO RESPONSE** — no Groq API key is configured, so this answer is simulated (not model output).';
  if(mode==='coding'){
    return `${hint}\n\nHere is a clean starting point based on *"${t.slice(0,80)}"*:\n\n[created: solution.js]\n\n\`\`\`js\nfunction solve(input) {\n  return input;\n}\n\nconsole.log(solve("hello"));\n\`\`\`\n\n**Next steps:**\n- Describe the expected input and output\n- Share any error messages or failing tests\n- I will refactor this into production-quality code.`;
  }
  if(mode==='research'){
    return `${hint}\n\n## Research notes: ${t.slice(0,60) || 'your topic'}\n\nA live web search was **not** performed. When the Groq Compound backend is connected, this mode returns real, source-cited answers.\n\nSimulated sources (for UI preview only):\n\n1. *Example Source One* — overview summary\n2. *Example Source Two* — key data points\n3. *Example Source Three* — further reading`;
  }
  if(mode==='vision'){
    return `${hint}\n\nVISION MODEL UNAVAILABLE — no image analysis was performed. Configure a Groq vision model in \`.env\` to enable real image understanding.`;
  }
  
  return `${hint}\n\nYou asked about **"${t.slice(0,80) || 'this'}"**. Here is a concise take:\n\n- **What it is** — a brief, clear explanation of the core idea.\n- **Why it matters** — the practical takeaway for your situation.\n- **Next step** — the single most useful thing to do next.\n\nAdd a Groq API key to \`.env\` and I will answer with a real model instead of this preview.`;
}


function inlineMd(value){
  const codeTokens = [];
  let text = esc(value);
  text = text.replace(/`([^`\n]+)`/g, (_, code)=>{
    const token = `\uE000${codeTokens.length}\uE001`;
    codeTokens.push(`<code class="inline">${code}</code>`);
    return token;
  });
  text = text.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
  text = text.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  text = text.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
  text = text.replace(/\$([^$\n]+)\$/g, '<span class="latex">$1</span>');
  return text.replace(/\uE000(\d+)\uE001/g, (_, index)=>codeTokens[Number(index)] || '');
}
function isMarkdownBlockStart(line){
  return /^\s*```/.test(line) || /^(#{1,6})\s+/.test(line) || /^\s*>\s?/.test(line) || /^\s*[-*+]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line) || /^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line) || /^\s*\|.*\|\s*$/.test(line);
}
function renderMarkdown(src){
  if(src == null || src === '') return '';
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  let html = '';
  let i = 0;
  let listType = '';
  let listItems = [];
  const flushList = ()=>{
    if(!listType) return;
    html += `<${listType}>${listItems.join('')}</${listType}>`;
    listType = '';
    listItems = [];
  };
  while(i < lines.length){
    const line = lines[i];
    const fence = line.match(/^\s*```([\w+-]*)\s*$/);
    if(fence){
      flushList();
      const language = fence[1] || 'text';
      const codeLines = [];
      i += 1;
      while(i < lines.length && !/^\s*```\s*$/.test(lines[i])){
        codeLines.push(lines[i]);
        i += 1;
      }
      if(i < lines.length) i += 1;
      html += `<pre><div class="pre-head"><span class="lang">${esc(language)}</span><button type="button" class="copy">COPY</button></div><code>${esc(codeLines.join('\n'))}</code></pre>`;
      continue;
    }
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if(heading){
      flushList();
      const level = heading[1].length;
      html += `<h${level}>${inlineMd(heading[2])}</h${level}>`;
      i += 1;
      continue;
    }
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line) && !line.trim().startsWith('* ')){
      flushList();
      html += '<hr>';
      i += 1;
      continue;
    }
    if(/^\s*>\s?/.test(line)){
      flushList();
      const quote = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){
        quote.push(lines[i].replace(/^\s*>\s?/, ''));
        i += 1;
      }
      html += `<blockquote>${quote.map(part=>`<p>${inlineMd(part)}</p>`).join('')}</blockquote>`;
      continue;
    }
    if(/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
      flushList();
      const cells = (row)=>row.trim().replace(/^\||\|$/g, '').split('|').map(cell=>cell.trim());
      const header = cells(line);
      i += 2;
      const rows = [];
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        rows.push(cells(lines[i]));
        i += 1;
      }
      html += `<table><thead><tr>${header.map(cell=>`<th>${inlineMd(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${header.map((_, index)=>`<td>${inlineMd(row[index] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      continue;
    }
    const unordered = line.match(/^\s*[-*+]\s+(.*)$/);
    const ordered = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(unordered || ordered){
      const nextType = unordered ? 'ul' : 'ol';
      if(listType && listType !== nextType) flushList();
      listType = nextType;
      const item = unordered ? unordered[1] : ordered[1];
      const task = item.match(/^\[([ xX])\]\s+(.*)$/);
      listItems.push(task ? `<li class="task-item"><input type="checkbox" disabled ${task[1].toLowerCase() === 'x' ? 'checked' : ''}>${inlineMd(task[2])}</li>` : `<li>${inlineMd(item)}</li>`);
      i += 1;
      continue;
    }
    if(!line.trim()){
      flushList();
      i += 1;
      continue;
    }
    flushList();
    const paragraph = [line.trim()];
    i += 1;
    while(i < lines.length && lines[i].trim() && !isMarkdownBlockStart(lines[i])){
      paragraph.push(lines[i].trim());
      i += 1;
    }
    html += `<p>${inlineMd(paragraph.join(' '))}</p>`;
  }
  flushList();
  return html;
}

function normalizeWorkspacePath(value){
  const source = String(value || '').trim().replace(/^['"`\s]+|['"`\s]+$/g, '').replace(/\\/g, '/').replace(/^\.\//, '').replace(/\/+/g, '/');
  const trailingSlash = source.endsWith('/');
  const path = source.replace(/\/+$/, '');
  if(!path || path.split('/').some(part=>part === '..' || !part)) return '';
  return trailingSlash ? path + '/' : path;
}
function workspaceFileBytes(file){
  const content = String((file && file.content) || '');
  if(file && file.encoding === 'dataurl' && /^data:[^,]*;base64,/.test(content)){
    const binary = atob(content.slice(content.indexOf(',') + 1));
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i+=1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  return new TextEncoder().encode(content);
}
function workspaceFolderPaths(){
  const paths = new Set((state.workspaceFolders || []).map(normalizeWorkspacePath).filter(Boolean));
  (state.workspaceFiles || []).forEach(file=>{
    const bits = normalizeWorkspacePath(file.name).split('/');
    bits.pop();
    let folder = '';
    bits.forEach(bit=>{
      folder = folder ? folder + '/' + bit : bit;
      if(folder) paths.add(folder);
    });
  });
  return Array.from(paths).sort((a,b)=>a.localeCompare(b));
}
function saveWorkspace(){
  lsSet(LS.workspaceFiles, state.workspaceFiles || []);
  lsSet(LS.workspaceFolders, workspaceFolderPaths());
}
function addWorkspaceFolder(path){
  const clean = normalizeWorkspacePath(path).replace(/\/$/, '');
  if(!clean) return false;
  const folders = new Set(workspaceFolderPaths());
  const before = folders.size;
  const parts = clean.split('/');
  let current = '';
  parts.forEach(part=>{
    current = current ? current + '/' + part : part;
    folders.add(current);
  });
  state.workspaceFolders = Array.from(folders);
  if(folders.size !== before) saveWorkspace();
  return folders.size !== before;
}
function workspaceLanguage(path, fallback){
  if(fallback) return String(fallback).toLowerCase();
  const ext = normalizeWorkspacePath(path).split('.').pop().toLowerCase();
  return ext || 'text';
}
function upsertWorkspaceFile(entry){
  const name = normalizeWorkspacePath(entry && entry.name);
  if(!name) return null;
  const files = state.workspaceFiles || [];
  const index = files.findIndex(file=>normalizeWorkspacePath(file.name) === name);
  const current = index >= 0 ? files[index] : null;
  const next = Object.assign({}, current || {}, entry || {}, {
    id: (current && current.id) || (entry && entry.id) || uid(),
    name,

function saveUploadedFileToWorkspace(file){

      return;
    }
    const item = upsertWorkspaceFile({
      name:path,
      language:block && block.language,
      content:block ? block.content : '',

function zipCrc32(bytes){

function workspaceZipBlob(){

    zipWrite32(centralView,0,0x02014b50); zipWrite16(centralView,4,20); zipWrite16(centralView,6,20); zipWrite16(centralView,8,0); zipWrite16(centralView,10,0);
    zipWrite16(centralView,12,date.time); zipWrite16(centralView,14,date.date); zipWrite32(centralView,16,crc);

    zipWrite16(centralView,34,0); zipWrite16(centralView,36,0); zipWrite32(centralView,38,entry.name.endsWith('/') ? 16 : 0); zipWrite32(centralView,42,offset);
    central.set(name,46); centrals.push(central);

function currentInputText(){ return $('#composer-input').value.trim(); }



const MEM_TRIGGERS = /^(?:ingat|inget|remember|remembering|catat)(?:\s+(?:ini|kan|dong|ya|aja|ya\b|this|that|it|that\b))?\b/i;

function saveMemoryItem(fact){
  if(!fact) return false;
  const exists = state.memory.items.some(m => String(m).toLowerCase() === fact.toLowerCase());
  if(exists) return false;
  state.memory.items.push(fact);
  if(state.memory.items.length > 50) state.memory.items = state.memory.items.slice(-50);
  saveMemory();
  toast('SAVED TO MEMORY ✓');
  return true;
}


function detectMemoryCommand(text){
  if(!state.memory.on) return;
  const t = (text || '').trim();
  if(!t) return;
  const m = t.match(MEM_TRIGGERS);
  if(!m) return;
  const fact = t.slice(m[0].length).replace(/^[\s:.,\-—]+/, '').trim();
  if(fact.length >= 4) saveMemoryItem(fact.slice(0, 300));
}


function withContext(history){
  const ci = ((state.custom.about || '') + '\n' + (state.custom.respond || '')).trim();
  const mem = (state.memory.on ? state.memory.items : []).slice(-50);
  const extras = {};
  if(ci) extras._custom = ci.slice(0, 5000);
  if(mem.length) extras._memory = mem;
  if(history.length && Object.keys(extras).length){
    history[0] = Object.assign({}, history[0], extras);
  }
  return history;
}

async function sendMessage(){
  if(state.streaming) return;
  state.view = 'chat';
  const text = currentInputText();
  const hasAttach = state.attachments.length>0;
  if(!text && !hasAttach) return;

  
  if(!currentConversation()){
    const title = makeTitle(text || (state.attachments[0]||{}).name || 'New chat');
    const c = { id:uid(), title, mode:state.mode, model:MODES[state.mode].modelLabel, createdAt:now(), updatedAt:now(), pinned:false, archived:false, projectId:null, messages:[] };
    state.conversations.unshift(c);
    state.currentId = c.id;
    saveConversations();
  }
  const c = currentConversation();
  c.mode = state.mode;
  c.model = MODES[state.mode].modelLabel;

  const userMsg = { role:'user', content:text, ts:now() };
  if(hasAttach){ userMsg.attachments = state.attachments.map(a=>({kind:a.kind,name:a.name,ext:a.ext,size:a.size,dataUrl:a.dataUrl,readable:a.readable,text:a.text})); }
  c.messages.push(userMsg);
  c.updatedAt = now();
  detectMemoryCommand(text);

  
  let contentForModel = text;
  const readableAttach = state.attachments.filter(a=>a.readable && a.text);
  if(readableAttach.length){
    const blocks = readableAttach.map(a=>`[Attached file: ${a.name}]\n${a.text}`).join('\n\n');
    contentForModel = text ? `${text}\n\n${blocks}` : blocks;
  } else if(hasAttach && state.attachments.some(a=>!a.readable)){
    contentForModel = text ? text : `[File attached: ${state.attachments.map(a=>a.name).join(', ')}]`;
  }
  if(state.mode==='coding'){
    contentForModel += '\n\nWhen you create a file, put [created: relative/path.ext] immediately before its fenced code block. When you create a folder, put [created: relative/folder/].';
  }

  $('#composer-input').value='';
  autoGrow();
  state.attachments=[];
  renderAttachments();
  renderAll();
  closeComposerSubMenus();

  
  const asst = { role:'assistant', content:'', ts:now(), model:MODES[state.mode].modelLabel, demo:isDemo() };
  c.messages.push(asst);
  renderChat();

  
  const history = withContext(c.messages.slice(0,-1).filter(m=>!m.demo).map(m=>({role:m.role, content: m===userMsg ? contentForModel : m.content})));

  state.streaming = true;
  state.wasCancelled = false;
  state.controller = new AbortController();
  updateComposerState();
  renderStreamingUI();

  const res = await streamChat(state.mode, history, (delta)=>{
    if(state.wasCancelled) return;
    asst.content += delta;
    throttleRender();
  }, state.controller.signal);

  state.streaming = false;
  state.controller = null;
  updateComposerState();

  if(state.wasCancelled || res.error==='ABORTED'){
    const idx = c.messages.indexOf(asst);
    if(idx !== -1) c.messages.splice(idx, 1);
    state.wasCancelled = false;
    c.updatedAt = now();
    saveConversations();
    renderAll();
    toast('MESSAGE CANCELLED');
    return;
  }

  if(res.error){
    asst.content = asst.content || '';
    if(res.error==='VISION_MODEL_UNAVAILABLE'){
      asst.content = '**VISION MODEL UNAVAILABLE**\n\n'+(res.message||'No Groq vision-capable model is configured on this server.');
    } else if(res.error==='NO_KEYS'){
      
      asst.content = asst.content || demoAnswer(state.mode, text);
      asst.demo = true;
    } else if(res.error==='NETWORK'){
      asst.content = '**CONNECTION LOST.**\n\n[ TRY AGAIN ]';
    } else {
      asst.content = asst.content || '**SOMETHING WENT WRONG.**\n\n[ TRY AGAIN ]';
    }
  }
  if(res.demo) asst.demo = true;

  if(!asst.content) asst.content = '*(empty response)*';
  const createdItems = captureAssistantWorkspaceArtifacts(asst.content);
  c.updatedAt = now();
  saveConversations();
  renderAll();
  if(createdItems.length) toast('AI SAVED TO WORKSPACE: ' + createdItems.join(', ').toUpperCase());
  maybeAutoRead(asst.content);
}

}

function stopGenerating(){
  if(!state.streaming) return;
  state.wasCancelled = true;
  if(state.controller){
    try{ state.controller.abort(); }catch(e){}
  }
  const c = currentConversation();
  if(c && c.messages && c.messages.length > 0){
    const last = c.messages[c.messages.length - 1];
    if(last && last.role === 'assistant'){
      c.messages.pop();
    }
  }
  state.streaming = false;
  state.controller = null;
  updateComposerState();
  saveConversations();
  renderAll();
  toast('MESSAGE CANCELLED');

  const b=$('#btn-send');
  const label=$('#send-label');
  if(state.streaming){
    label.textContent='CANCEL';
    b.setAttribute('aria-label','Cancel and discard message');
    b.classList.add('btn-cancel-active');

  }

function addFiles(files){
  Array.from(files).forEach(async f=>{
    saveUploadedFileToWorkspace(f);
    const ext = ('.'+f.name.split('.').pop()).toLowerCase();
    const isImg = f.type && f.type.startsWith('image/');
    const a = { kind: isImg?'image':'file', name:f.name.toUpperCase(), ext, size:f.size, readable:false, text:null, dataUrl:null };
    state.attachments.push(a);
    renderAttachments();
    
    if(!isImg){
      try{
        const fd = new FormData(); fd.append('file', f);
        const r = await fetch(API_BASE + '/api/upload',{method:'POST',body:fd});
        if(r.ok){ const j = await r.json(); a.readable = !!j.readable; a.text = j.text || null; }
      }catch(e){}
    } else {
      const r = new FileReader();
      r.onload = ()=>{ a.dataUrl = r.result; renderAttachments(); };
      r.readAsDataURL(f);
    }
    renderAttachments();
    toast('FILE UPLOADED');
  });
}

    </div>`);
  const keys = ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+','C'];
  let expr='';
  const disp=()=>{ $('#calc-display').textContent = expr || '0'; };
  $('#calc-grid').innerHTML = keys.map(k=>`<button class="btn" style="justify-content:center;padding:12px" data-k="${k}">${k}</button>`).join('');

      try{
        let e = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');

    disp();
  }));
  disp();

function renderCanvasBody(){
  const body = $('#canvas-body');
  const kind = state.canvas.kind;
  if(kind==='code'){
    body.innerHTML = `<div class="canvas-code-wrap">
      <div class="canvas-gutter" id="canvas-gutter"></div>
      <textarea id="canvas-input" class="code" spellcheck="false" aria-label="Code editor"></textarea>
    </div>`;
    const ta=$('#canvas-input'); ta.value = state.canvas.doc;
    ta.addEventListener('input', ()=>{ pushHistory(ta.value); updateGutter(ta); });
    updateGutter(ta);
  } else {
    body.innerHTML = `<textarea id="canvas-input" aria-label="Document editor"></textarea>`;
    const ta=$('#canvas-input'); ta.value = state.canvas.doc;
    ta.addEventListener('input', ()=>pushHistory(ta.value));
  }
  const previewing = body.dataset.preview==='1';
  if(previewing) toggleCanvasPreview();
}
function updateGutter(ta){
  const g=$('#canvas-gutter'); if(!g) return;
  const n = ta.value.split('\n').length;
  let s=''; for(let i=1;i<=n;i++) s+=i+'\n';
  g.textContent = s;
  ta.scrollTop = 0; 
  
  ta.onscroll = ()=>{ g.scrollTop = ta.scrollTop; };
}
function pushHistory(v){
  const h=state.canvas.history, i=state.canvas.hidx;
  if(h[i]===v) return;
  state.canvas.history = h.slice(0,i+1).concat([v]);
  state.canvas.hidx = state.canvas.history.length-1;
}
function canvasUndo(){ if(state.canvas.hidx>0){ state.canvas.hidx--; state.canvas.doc=state.canvas.history[state.canvas.hidx]; refreshCanvasDoc(); } }
function canvasRedo(){ if(state.canvas.hidx<state.canvas.history.length-1){ state.canvas.hidx++; state.canvas.doc=state.canvas.history[state.canvas.hidx]; refreshCanvasDoc(); } }
function refreshCanvasDoc(){
  const ta=$('#canvas-input'); if(ta){ ta.value=state.canvas.doc; if(state.canvas.kind==='code') updateGutter(ta); }
  const pv=$('#canvas-preview'); if(pv) pv.innerHTML = renderMarkdown(state.canvas.doc);
}
function toggleCanvasPreview(){
  const body=$('#canvas-body');
  if(body.dataset.preview==='1'){
    body.dataset.preview='0';
    state.canvas.doc = $('#canvas-input').value;
    renderCanvasBody();
  } else {
    state.canvas.doc = $('#canvas-input') ? $('#canvas-input').value : state.canvas.doc;
    body.dataset.preview='1';
    body.innerHTML = `<div class="canvas-preview md" id="canvas-preview">${renderMarkdown(state.canvas.doc)}</div>`;
  }
}
function exportCanvas(){

function closeSearch(){ $('#search-overlay').classList.remove('open'); $('#search-res').innerHTML=''; }
function runSearch(q){
  q=(q||'').trim().toLowerCase();
  $('#search-res').innerHTML='';
  if(!q){ $('#search-res').innerHTML='<div class="search-empty">TYPE TO SEARCH CHATS, PROJECTS AND FILES</div>'; return; }
  
  $('#search-res').innerHTML='<div class="search-empty">SEARCHING...</div>';
  setTimeout(()=>{
    const hl = (txt)=> txt.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
    const chats = state.conversations.filter(c=> c.title.toLowerCase().includes(q) || c.messages.some(m=>(m.content||'').toLowerCase().includes(q)));
    const projs = state.projects.filter(p=> p.name.toLowerCase().includes(q));
    const files = [];
    state.projects.forEach(p=>(p.files || []).forEach(f=>{ if((f.name || '').toLowerCase().includes(q)) files.push({name:f.name,proj:p.name}); }));
    let html='';
    const empty = !chats.length && !projs.length && !files.length;
    if(chats.length){ html+='<div class="sr-label">CHATS</div>'+chats.map(c=>`<button class="sr-item" data-open="${c.id}">${hl(esc(c.title))}</button>`).join(''); }
    if(projs.length){ html+='<div class="sr-label">PROJECTS</div>'+projs.map(p=>`<button class="sr-item" data-openproj="${p.id}">${hl(esc(p.name))}</button>`).join(''); }
    if(files.length){ html+='<div class="sr-label">FILES</div>'+files.map(f=>`<div class="sr-item">${hl(esc(f.name))} <span class="faint">· ${esc(f.proj)}</span></div>`).join(''); }
    if(empty) html='<div class="search-empty">NO RESULTS FOR "'+esc(q)+'"</div>';
    $('#search-res').innerHTML=html;
    if(empty) return;
    $$('#search-res [data-open]').forEach(b=>b.addEventListener('click',()=>{ state.currentId=b.getAttribute('data-open'); state.view='chat'; closeSearch(); renderAll(); }));
    $$('#search-res [data-openproj]').forEach(b=>b.addEventListener('click',()=>{ state.view='projects'; closeSearch(); renderAll(); }));
    
    if(!state.search.history.includes(q)){ state.search.history.unshift(q); state.search.history=state.search.history.slice(0,5); lsSet(LS.search,state.search.history); }
  }, 180);
}


let mediaRecorder=null, audioChunks=[];
async function toggleVoice(){
  if(state.listening){ stopRecording(); return; }
  if(!window.isSecureContext){
    toast('MICROPHONE REQUIRES HTTPS'); return;
  }
  if(!navigator.mediaDevices || !window.MediaRecorder){
    toast('VOICE NOT SUPPORTED IN THIS BROWSER'); return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks=[];
    mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
    mediaRecorder.onstop = ()=>onRecordingStop(stream);
    mediaRecorder.start();
    state.listening=true;
    showVoicePill(true);
  }catch(e){ toast('MICROPHONE ACCESS DENIED'); }
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}
function onRecordingStop(stream){
  const recorder = mediaRecorder;
  stream.getTracks().forEach(t=>t.stop());
  state.listening=false;
  mediaRecorder=null;
  const blob = new Blob(audioChunks,{type:(recorder && recorder.mimeType)||'audio/webm'});
  showVoicePill(false, blob);
}
function showVoicePill(listening, blob){
  const box=$('.composer-box');
  let pill=box.querySelector('.voice-pill');
  if(!pill){ pill=el('div','voice-pill'); box.insertBefore(pill, box.querySelector('.composer-foot')); }
  if(listening){
    pill.innerHTML = `<span class="wave">${'<i></i>'.repeat(5)}</span> LISTENING... <span class="faint" style="font-size:11px">TAP TO STOP</span>`;
    pill.style.cursor='pointer';
    pill.onclick = stopRecording;
  } else {
    pill.innerHTML = `<span style="font-family:var(--font-pixel);font-size:8px">VOICE MESSAGE</span>
      <button class="icon-btn" id="vp-play">${PLAY_SVG}</button>
      <button class="icon-btn" id="vp-del">${TRASH_SVG}</button>
      <div class="spacer"></div>
      <button class="btn primary" id="vp-send" style="padding:6px 12px">SEND</button>`;
    pill.onclick=null;
    let audioUrl=null;
    pill.querySelector('#vp-play').addEventListener('click',async ()=>{
      if(!audioUrl){
        
        if(state.backend.reachable && state.backend.keysLoaded>0){
          const fd=new FormData(); fd.append('file', blob, 'audio.webm');
          const r=await fetch(API_BASE + '/api/transcribe',{method:'POST',body:fd});
          if(r.ok){ const j=await r.json(); $('#composer-input').value = (j.text||'').trim(); autoGrow(); toast('TRANSCRIBED'); pill.remove(); return; }
        }
        toast('TRANSCRIPTION UNAVAILABLE — PLAYING AUDIO');
        audioUrl=URL.createObjectURL(blob);
        const au=new Audio(audioUrl); au.playbackRate=state.settings.voice.playbackSpeed; au.play();
      } else { const au=new Audio(audioUrl); au.play(); }
    });
    pill.querySelector('#vp-del').addEventListener('click',()=>pill.remove());
    pill.querySelector('#vp-send').addEventListener('click',()=>{
      state.attachments.push({kind:'audio',name:'VOICE.WEBM',ext:'.webm',size:blob.size,readable:false});
      pill.remove(); renderAttachments();
    });
  }
}


function speak(text){
  if(!('speechSynthesis' in window)){ toast('READ ALOUD NOT SUPPORTED'); return; }
  const plain = text.replace(/[#*`>_~\[\]()|]/g,'').replace(/```[\s\S]*?```/g,'').trim();
  const u=new SpeechSynthesisUtterance(plain.slice(0,2000));
  u.rate = state.settings.voice.playbackSpeed;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

        renderAll();
        toast('ADDED TO WORKSPACE: ' + name);
      }
    });
  });
  const c=currentConversation(); if(!c) return;
  
  $$('#chat-inner [data-aact]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.closest('.msg').getAttribute('data-i');
    const m=c.messages[i];

    if(act==='copy'){ navigator.clipboard.writeText(m.content).then(()=>toast('COPIED TO CLIPBOARD')); }
    else if(act==='copyMd'){ navigator.clipboard.writeText(m.content).then(()=>toast('COPIED AS MARKDOWN')); }
    else if(act==='retry'){ retryMessage(i); }
    else if(act==='like'){ toast('FEEDBACK SAVED'); }
    else if(act==='dislike'){ toast('FEEDBACK SAVED'); }
    else if(act==='speak'){ speak(m.content); }
    else if(act==='more'){ messageMoreMenu(i, m, b); }
  }));
  
  $$('#chat-inner pre .copy').forEach(b=>b.addEventListener('click',()=>{
    const code = b.closest('pre').querySelector('code');
    navigator.clipboard.writeText(code ? code.textContent : '').then(()=>toast('COPIED TO CLIPBOARD'));
  }));

    const i=+b.closest('.msg').getAttribute('data-i');

    else if(act==='edit'){ editUserMessage(i,m); }
    else if(act==='del'){ c.messages.splice(i,1); saveConversations(); renderAll(); toast('MESSAGE DELETED'); }
  }));
}
function retryMessage(i){
  const c=currentConversation(); if(!c) return;
  const prevUser = [...c.messages.slice(0,i)].reverse().find(m=>m.role==='user');
  if(!prevUser) return;
  c.messages = c.messages.slice(0,i); 
  c.updatedAt = now();
  renderChat();
  regenerateFrom();
}
async function regenerateFrom(){
  const c=currentConversation();
  c.updatedAt=now();
  const asst={role:'assistant',content:'',ts:now(),model:MODES[state.mode].modelLabel,demo:isDemo()};
  c.messages.push(asst);
  renderChat();
  const history=withContext(c.messages.slice(0,-1).filter(m=>!m.demo).map(m=>({role:m.role,content:m.content})));
  state.streaming=true; state.wasCancelled=false; state.controller=new AbortController(); updateComposerState();
  const res=await streamChat(state.mode, history, d=>{ if(state.wasCancelled) return; asst.content+=d; throttleRender(); }, state.controller.signal);
  state.streaming=false; state.controller=null; updateComposerState();
  if(state.wasCancelled || res.error==='ABORTED'){
    const idx = c.messages.indexOf(asst);
    if(idx !== -1) c.messages.splice(idx, 1);
    state.wasCancelled=false;
    c.updatedAt=now(); saveConversations(); renderAll();
    toast('MESSAGE CANCELLED');
    return;
  }
  if(res.error) asst.content='**SOMETHING WENT WRONG.**\n\n[ TRY AGAIN ]';
  if(res.demo) asst.demo=true;
  if(!asst.content) asst.content='*(empty response)*';
  const createdItems = captureAssistantWorkspaceArtifacts(asst.content);
  c.updatedAt=now(); saveConversations(); renderAll();
  if(createdItems.length) toast('AI SAVED TO WORKSPACE: ' + createdItems.join(', ').toUpperCase());
}

function supabaseConfig(){
  const url = String((document.querySelector('meta[name="supabase-url"]') || {}).content || window.REXWORK_SUPABASE_URL || '').trim().replace(/\/+$/, '');
  const key = String((document.querySelector('meta[name="supabase-anon-key"]') || {}).content || window.REXWORK_SUPABASE_ANON_KEY || '').trim();
  return { url, key };
}
let supabaseClient = null;
function getSupabaseClient(){
  if(supabaseClient) return supabaseClient;
  const { url, key } = supabaseConfig();
  if(!url || !key || !window.supabase || !window.supabase.createClient) return null;
  supabaseClient = window.supabase.createClient(url, key, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  return supabaseClient;
}
function profilePayload(auth){
  const displayName = getUserDisplayName();
  return {
    id: auth.id || auth.userId,
    display_name: displayName,
    avatar_path: auth.avatarPath || auth.avatar_path || null,
    avatar_url: getAuthAvatar(auth) || null,
    avatar_color: auth.avatarColor || '#ffb000',
    age: Number.isInteger(Number(auth.age)) ? Number(auth.age) : null,
    job_title: auth.jobs || auth.jobTitle || null,
    description: auth.description || null,
    onboarded: Boolean(auth.onboarded)
  };
}
function mergeProfileIntoAuth(profile){
  if(!profile) return state.auth;
  state.auth = Object.assign({}, state.auth || {}, {
    id: profile.id || (state.auth || {}).id,
    userId: profile.id || (state.auth || {}).userId,
    name: profile.display_name || (state.auth || {}).name,
    avatar: profile.avatar_url || (state.auth || {}).avatar || '',
    avatarUrl: profile.avatar_url || (state.auth || {}).avatarUrl || '',
    avatarPath: profile.avatar_path || (state.auth || {}).avatarPath || '',
    avatarColor: profile.avatar_color || (state.auth || {}).avatarColor || '#ffb000',
    age: profile.age == null ? (state.auth || {}).age : profile.age,
    jobs: profile.job_title || (state.auth || {}).jobs || '',
    description: profile.description || (state.auth || {}).description || '',
    onboarded: Boolean(profile.onboarded || (state.auth || {}).onboarded)
  });
  localStorage.setItem('rexwork_auth', JSON.stringify(state.auth));
  localStorage.setItem('rexwork_profile', JSON.stringify(state.auth));
  return state.auth;
}
async function hydrateAuthFromSupabase(){
  const client = getSupabaseClient();
  if(!client) return authProfile();
  try{
    const { data, error } = await client.auth.getSession();
    if(error || !data || !data.session) return authProfile();
    const session = data.session;
    const user = session.user;
    const metadata = user.user_metadata || {};
    const current = authProfile() || {};
    const merged = Object.assign({}, current, {
      id: user.id,
      userId: user.id,
      email: user.email || current.email || '',
      provider: (user.app_metadata || {}).provider || current.provider || 'supabase',
      access_token: session.access_token,
      name: metadata.full_name || metadata.name || metadata.user_name || current.name || current.username || '',
      username: metadata.user_name || metadata.preferred_username || current.username || '',
      avatar: metadata.avatar_url || metadata.picture || current.avatar || '',
      avatarUrl: metadata.avatar_url || metadata.picture || current.avatarUrl || ''
    });
    localStorage.setItem('rexwork_auth', JSON.stringify(merged));
    return merged;
  }catch(error){
    return authProfile();
  }
}
async function syncProfileFromSupabase(){
  const client = getSupabaseClient();
  const id = (state.auth || {}).id || (state.auth || {}).userId;
  if(!client || !id) return null;
  try{
    const { data, error } = await client.from('profiles').select('*').eq('id', id).maybeSingle();
    if(error) return null;
    if(data) return mergeProfileIntoAuth(data);
    const { data: created, error: createError } = await client.from('profiles').upsert(profilePayload(state.auth), { onConflict:'id' }).select().maybeSingle();
    if(createError || !created) return null;
    return mergeProfileIntoAuth(created);
  }catch(error){
    return null;
  }
}
async function uploadProfileAvatar(file, userId){
  const client = getSupabaseClient();
  if(!client || !file || !userId) return null;
  if(file.size > 5 * 1024 * 1024) throw new Error('Avatar image exceeds 5 MB');
  const declaredType = String(file.type || '').toLowerCase();
  if(!declaredType.startsWith('image/')) throw new Error('Avatar must be an image');
  const extension = ({ 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp', 'image/gif':'gif' })[declaredType] || 'png';
  const path = `${userId}/avatar.${extension}`;
  const { error } = await client.storage.from('avatars').upload(path, file, { upsert:true, cacheControl:'3600', contentType:declaredType });
  if(error) throw error;
  const { data } = client.storage.from('avatars').getPublicUrl(path);
  return { path, url: `${data.publicUrl}?v=${Date.now()}` };
}
async function persistUserProfile(auth, avatarFile){
  const client = getSupabaseClient();
  const id = auth.id || auth.userId;
  if(!client || !id) return auth;
  const next = Object.assign({}, auth);
  if(avatarFile){
    const uploaded = await uploadProfileAvatar(avatarFile, id);
    if(uploaded){
      next.avatar = uploaded.url;
      next.avatarUrl = uploaded.url;
      next.avatarPath = uploaded.path;
    }
  }
  const { data, error } = await client.from('profiles').upsert(profilePayload(next), { onConflict:'id' }).select().maybeSingle();
  if(error) throw error;
  state.auth = next;
  if(data) mergeProfileIntoAuth(data);
  localStorage.setItem('rexwork_auth', JSON.stringify(state.auth));
  localStorage.setItem('rexwork_profile', JSON.stringify(state.auth));
  return state.auth;
}

async function boot(){
  const auth = await hydrateAuthFromSupabase();
  if(!auth || (!auth.provider && !auth.id && !auth.userId)){
    window.location.replace('Main.html');
    return;
  }
  state.auth = auth;
  loadAll();

  const savedProf = lsGet('rexwork_profile', null);
  state.auth = Object.assign({}, savedProf || {}, state.auth);
  await syncProfileFromSupabase();
  const wasOnboarded = lsGet('rexwork_onboarded', false) || Boolean(state.auth && state.auth.onboarded) || Boolean(savedProf && savedProf.onboarded);

  if(wasOnboarded){
    state.auth.onboarded = true;
    state.view = 'chat';
  } else {
    state.view = 'onboarding';
  }

  const savedFiles = lsGet(LS.workspaceFiles, null);
  if(Array.isArray(savedFiles)){
    state.workspaceFiles = savedFiles.filter(file=>file && !['f_main','f_app'].includes(file.id));
    state.activeFileId = state.workspaceFiles[0] ? state.workspaceFiles[0].id : null;
  }
  const savedFolders = lsGet(LS.workspaceFolders, null);
  if(Array.isArray(savedFolders)) state.workspaceFolders = savedFolders.map(normalizeWorkspacePath).filter(Boolean);

  if(state.mode && MODES[state.mode]){} else state.mode='chat';
  if(lsGet('rexwork_sidebar_collapsed', false)){
    document.body.classList.add('sidebar-collapsed');
  }
  window.addEventListener('keydown', e=>{
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='b'){
      e.preventDefault();
      toggleSidebar();
    }
  });
  applyTheme();
  applyFont();
  bindEvents();
  renderAll();
  applyAuthToUI();
  autoGrow();
  await checkBackend();
  renderModePopover();
  renderAll();
}
