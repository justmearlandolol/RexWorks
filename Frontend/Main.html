<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>RexWork — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="icon" type="image/png" href="assets/rexworks-logo.png" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root{
  --bg:#0a0c11;
  --bg-2:#0e1118;
  --surface:#12161f;
  --surface-2:#171d28;
  --border:#263041;
  --border-soft:#1a2230;
  --text:#f0f3f8;
  --muted:#8b96aa;
  --faint:#505c72;
  --brand:#ffb000;
  --brand-hover:#ffc033;
  --brand-text:#141005;
  --red:#ff6b6b;
  --green:#51cf66;
  --font-pixel:'Press Start 2P','VT323','Courier New',monospace;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --font-body:'IBM Plex Mono',system-ui,-apple-system,sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
  padding:24px 16px;
  overflow-x:hidden;
  background-image:radial-gradient(rgba(255,176,0,.04) 1px, transparent 1.6px);
  background-size:26px 26px;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(ellipse at 50% 30%, transparent 50%, rgba(0,0,0,.6) 100%);
}

.login-wrap{
  position:relative; z-index:2;
  width:100%;
  max-width:390px;
  text-align:center;
  padding:12px 4px;
}

.rw-logo-tile{
  background-color:#05070b;
  background-image:var(--rw-logo);
  background-size:76%;
  background-position:center;
  background-repeat:no-repeat;
  border-radius:8px;
  box-shadow:0 0 0 1px var(--border), 0 0 20px rgba(255,176,0,.16);
}
.logo{
  width:58px; height:58px; margin:0 auto 24px;
  display:block;
  border-radius:12px;
  background-color:#05070b;
  background-image:var(--rw-logo);
  background-size:76%;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:0 0 28px rgba(255,176,0,.25), 0 4px 12px rgba(0,0,0,.5), 0 0 0 1px var(--border);
  user-select:none;
}

h1{
  font-family:var(--font-mono);
  font-size:26px;
  font-weight:600;
  letter-spacing:-.3px;
  color:var(--text);
  margin-bottom:28px;
}
h1 .cur{
  color:var(--brand);
  font-family:var(--font-pixel);
  font-size:16px;
  margin-left:4px;
  animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

.field{
  text-align:left;
  margin-bottom:16px;
}
.field label{
  display:block;
  font-size:13px;
  font-weight:500;
  color:var(--muted);
  margin-bottom:8px;
}
.field input{
  width:100%;
  height:48px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  padding:0 14px;
  color:var(--text);
  font-family:var(--font-mono);
  font-size:14.5px;
  outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field input:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 1px var(--brand), 0 0 16px rgba(255,176,0,.15);
}
.field input::placeholder{
  color:var(--faint);
}

.btn-primary{
  width:100%;
  height:48px;
  background:var(--brand);
  color:var(--brand-text);
  border:none;
  border-radius:6px;
  font-family:var(--font-mono);
  font-size:14.5px;
  font-weight:600;
  letter-spacing:.3px;
  cursor:pointer;
  transition:background .15s ease, transform .05s ease, box-shadow .15s ease;
  user-select:none;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.btn-primary:hover{
  background:var(--brand-hover);
  box-shadow:0 4px 16px rgba(255,176,0,.3);
}
.btn-primary:active{
  transform:scale(.99);
}
.btn-primary:disabled{
  opacity:.5;
  cursor:wait;
  transform:none;
}

.switch-row{
  margin-top:16px;
  font-size:13px;
  color:var(--muted);
}
.switch-row button{
  background:none;
  border:none;
  color:var(--brand);
  font-family:inherit;
  font-size:inherit;
  font-weight:500;
  cursor:pointer;
  margin-left:4px;
  text-decoration:none;
}
.switch-row button:hover{
  text-decoration:underline;
}

.divider{
  display:flex;
  align-items:center;
  gap:16px;
  margin:24px 0 20px;
  color:var(--faint);
  font-size:11.5px;
  font-weight:500;
  letter-spacing:1px;
}
.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--border-soft);
}

.social-stack{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.social-btn{
  width:100%;
  height:48px;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease, transform .05s ease;
  user-select:none;
}
.social-btn:hover{
  background:var(--surface-2);
  border-color:var(--brand);
}
.social-btn:active{
  transform:scale(.995);
}
.social-btn:disabled{
  opacity:.55;
  cursor:wait;
  transform:none;
}
.social-btn svg{
  flex:0 0 20px;
  display:block;
}
.social-btn span{
  flex:1;
  text-align:left;
}

.status-msg{
  min-height:18px;
  margin-top:18px;
  font-family:var(--font-pixel);
  font-size:7px;
  letter-spacing:1px;
  line-height:1.8;
  color:var(--brand);
  overflow-wrap:anywhere;
}

.foot-actions{
  margin-top:28px;
  font-size:11.5px;
  color:var(--faint);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}.foot-dot{
  width:3px; height:3px; border-radius:50%; background:var(--faint);
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo rw-logo-tile" aria-hidden="true"></div>
  <h1 id="title-text">Welcome back<span class="cur">█</span></h1>

  <form id="email-form" onsubmit="return false;">
    <div class="field">
      <label for="email-input" id="email-label">Email address*</label>
      <input type="email" id="email-input" autocomplete="email" placeholder="name@example.com" spellcheck="false" required />
    </div>

    <button type="submit" class="btn-primary" id="btn-continue">Continue</button>
  </form>

  <div class="switch-row">
    <span id="switch-prompt">Don't have an account?</span>
    <button type="button" id="btn-toggle">Sign Up</button>
  </div>

  <div class="divider"><span>OR</span></div>

  <div class="social-stack">
    <button type="button" class="social-btn" id="btn-google">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span id="google-label">Continue with Google</span>
    </button>
  </div>

  <div class="status-msg" id="status-msg"></div>

  <div class="foot-actions">
    <span>RexWork v1.1</span>
  </div>
</div>

<script>
'use strict';

const SUPABASE_URL = 'https://fdlklzveockeibcmijmz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_fhqAyClsPwkXDrqQVD2H5g_L1zyGihq';
const AUTH_KEY = 'rexwork_auth';

let sbClient = null;
function getSupabase(){
  if(sbClient) return sbClient;
  const sdk = window.supabase;
  if(sdk && typeof sdk.createClient === 'function'){
    try{
      sbClient = sdk.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });
    }catch(e){
      console.error(e);
    }
  }
  return sbClient;
}

const emailInput = document.getElementById('email-input');
const btnContinue = document.getElementById('btn-continue');
const btnGoogle = document.getElementById('btn-google');
const googleLabel = document.getElementById('google-label');
const btnToggle = document.getElementById('btn-toggle');
const titleText = document.getElementById('title-text');
const switchPrompt = document.getElementById('switch-prompt');
const statusMsg = document.getElementById('status-msg');

let isSignUp = false;

function setStatus(text, color){
  statusMsg.textContent = text || '';
  statusMsg.style.color = color || 'var(--brand)';
}

function saveAuthAndEnter(profile){
  let existing = {};
  try { existing = JSON.parse(localStorage.getItem(AUTH_KEY) || '{}'); } catch(e){}
  let savedProf = {};
  try { savedProf = JSON.parse(localStorage.getItem('rexwork_profile') || '{}'); } catch(e){}
  const wasOnboarded = localStorage.getItem('rexwork_onboarded') === 'true' || Boolean(existing.onboarded) || Boolean(savedProf.onboarded);
  const merged = Object.assign({}, savedProf, existing, profile, {
    onboarded: wasOnboarded,
    ts: Date.now()
  });
  localStorage.setItem(AUTH_KEY, JSON.stringify(merged));
  location.replace('index.html');
}

const isLogout = window.location.search.includes('logout=1');

async function handleAuthFlow(){
  const sb = getSupabase();
  if (isLogout) {
    localStorage.removeItem(AUTH_KEY);
    if (sb) {
      try { await sb.auth.signOut(); } catch(e){}
    }
    window.history.replaceState(null, '', window.location.pathname);
    return;
  }

  if (sb) {
    try {
      const { data: { session }, error } = await sb.auth.getSession();
      if (session && session.user) {
        processUserSession(session.user);
        return;
      }
    } catch (e) {}

    sb.auth.onAuthStateChange((event, session) => {
      if (session && session.user) {
        processUserSession(session.user);
      }
    });
  }

  try {
    const cached = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');

    // Never trust a locally forged/demo session: a real session needs an id
    // or userId plus provider metadata from Supabase.
    const looksReal = cached
      && cached.provider
      && (cached.id || cached.userId)
      && !cached.demo;

    if (looksReal) {
      setStatus('SESSION FOUND — OPENING REXWORK…', 'var(--green)');
      setTimeout(() => location.replace('index.html'), 300);
      return;
    }

    if (cached) localStorage.removeItem(AUTH_KEY);
  } catch (e) {
    localStorage.removeItem(AUTH_KEY);
  }
}

function processUserSession(u){
  setStatus('AUTHENTICATED! OPENING REXWORK…', 'var(--green)');
  const googleName = u.user_metadata?.full_name || u.user_metadata?.name || u.user_metadata?.user_name || u.user_metadata?.preferred_username || (u.email ? u.email.split('@')[0] : 'User');
  const googleAvatar = u.user_metadata?.avatar_url || u.user_metadata?.picture || '';

  if (window.location.search.includes('code=') || window.location.hash.includes('access_token')) {
    window.history.replaceState(null, '', window.location.pathname);
  }

  setTimeout(() => {
    saveAuthAndEnter({
      provider: 'google',
      id: u.id,
      email: u.email || '',
      name: googleName,
      avatar: googleAvatar
    });
  }, 400);
}

handleAuthFlow();

btnToggle.addEventListener('click', () => {
  isSignUp = !isSignUp;
  if (isSignUp) {
    titleText.innerHTML = 'Create your account<span class="cur">█</span>';
    switchPrompt.textContent = 'Already have an account?';
    btnToggle.textContent = 'Log in';
    btnContinue.textContent = 'Sign Up with Email';
    googleLabel.textContent = 'Sign Up with Google';
  } else {
    titleText.innerHTML = 'Welcome back<span class="cur">█</span>';
    switchPrompt.textContent = "Don't have an account?";
    btnToggle.textContent = 'Sign Up';
    btnContinue.textContent = 'Continue';
    googleLabel.textContent = 'Continue with Google';
  }
  setStatus('');
});

btnContinue.addEventListener('click', async () => {
  const email = (emailInput.value || '').trim();
  if (!email || !email.includes('@')) {
    setStatus('PLEASE ENTER A VALID EMAIL ADDRESS', 'var(--red)');
    emailInput.focus();
    return;
  }

  btnContinue.disabled = true;
  setStatus('CONNECTING…');

  const redirectUrl = window.location.origin + window.location.pathname;
  const sb = getSupabase();

  if (sb) {
    try {
      const { error } = await sb.auth.signInWithOtp({
        email: email,
        options: {
          emailRedirectTo: redirectUrl
        }
      });
      if (error) {
        setStatus((error.message || 'FAILED TO SEND LINK').toUpperCase(), 'var(--red)');
        btnContinue.disabled = false;
      } else {
        setStatus('MAGIC LINK SENT! CHECK YOUR EMAIL TO LOG IN.', 'var(--green)');
      }
      return;
    } catch (err) {}
  }

  btnContinue.disabled = false;
  setStatus('LOGIN SERVICE UNAVAILABLE — TRY AGAIN LATER', 'var(--red)');
});

btnGoogle.addEventListener('click', async () => {
  btnGoogle.disabled = true;
  const sb = getSupabase();
  if (!sb) {
    setStatus('SUPABASE CLIENT NOT READY — RETRYING…', 'var(--red)');
    setTimeout(() => { btnGoogle.disabled = false; }, 1200);
    return;
  }

  setStatus('REDIRECTING TO GOOGLE AUTH…');
  try {
    const redirectUrl = window.location.origin + window.location.pathname;

    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: redirectUrl,
        queryParams: {
          access_type: 'offline',
          prompt: 'select_account'
        }
      }
    });

    if (error) {
      setStatus('LOGIN FAILED: ' + (error.message || 'UNKNOWN').toUpperCase(), 'var(--red)');
      btnGoogle.disabled = false;
    }
  } catch (err) {
    setStatus('NETWORK ERROR — PLEASE RETRY', 'var(--red)');
    btnGoogle.disabled = false;
  }
